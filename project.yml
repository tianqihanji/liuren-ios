name: LiuRen
options:
  bundleIdPrefix: com.hanji
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  LiuRen:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: LiuRen
        PRODUCT_BUNDLE_IDENTIFIER: com.hanji.liuren
        INFOPLIST_FILE: Sources/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        ENABLE_BITCODE: "NO"
