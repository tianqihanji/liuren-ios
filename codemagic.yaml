workflows:
  ios-unsigned:
    name: 大六壬神课 iOS 未签名 IPA
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: "LiuRen"
        XCODE_PROJECT: "LiuRen.xcodeproj"
    scripts:
      - name: 生成 Xcode 工程
        script: |
          brew install xcodegen || true
          xcodegen generate
      - name: 编译（不签名）
        script: |
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/LiuRen.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""
      - name: 打包 IPA
        script: |
          mkdir -p build/Payload
          cp -R build/LiuRen.xcarchive/Products/Applications/LiuRen.app build/Payload/
          cd build && zip -qry LiuRen-unsigned.ipa Payload
          ls -lh LiuRen-unsigned.ipa
    artifacts:
      - build/LiuRen-unsigned.ipa
