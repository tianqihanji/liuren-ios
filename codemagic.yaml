workflows:
  ios-unsigned:
    name: 大六壬神课 iOS ad-hoc 签名 IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: "LiuRen"
        XCODE_PROJECT: "LiuRen.xcodeproj"
    scripts:
      - name: 生成 Xcode 工程
        script: |
          set -e
          brew install xcodegen || true
          xcodegen generate
          xcodebuild -project "$XCODE_PROJECT" -list || true
      - name: 编译（先不签名）
        script: |
          set -o pipefail
          mkdir -p build
          xcodebuild -quiet \
            -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -configuration Release -sdk iphoneos \
            -archivePath build/LiuRen.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee build/xc.log | tail -40
          st=${PIPESTATUS[0]}
          echo "xcodebuild exit=$st"
          if [ "$st" -ne 0 ]; then
            echo "==== 错误行 ===="
            grep -n -E "error:|fatal error|ld: |BUILD FAILED|ARCHIVE FAILED" build/xc.log | head -20
          fi
          exit $st
      - name: ad-hoc 签名并校验
        script: |
          set -e
          APP=$(find build/LiuRen.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          rm -rf "$APP/_CodeSignature"
          codesign --force --sign - --timestamp=none --identifier com.hanji.liuren "$APP"
          echo "==== codesign -dv ===="
          codesign -dvv "$APP" 2>&1 | head -20
          echo "==== verify ===="
          codesign --verify --strict --verbose=2 "$APP" && echo "VERIFY_OK"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist"
          ls -l "$APP/_CodeSignature"
      - name: 打包 IPA
        script: |
          set -e
          APP=$(find build/LiuRen.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry LiuRen-adhoc.ipa Payload
          ls -l LiuRen-adhoc.ipa
          unzip -l LiuRen-adhoc.ipa | head -20
    artifacts:
      - build/*.ipa
      - build/xc.log
