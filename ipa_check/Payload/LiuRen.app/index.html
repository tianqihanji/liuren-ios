<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="大六壬神课">
<meta name="theme-color" content="#0a0d18">
<title>大六壬神课 · 汉基</title>
<style>
:root{
  --bg:#070a12; --panel:rgba(20,26,44,.72); --line:rgba(255,255,255,.14);
  --txt:#eef2ff; --dim:#9aa6c4; --gold:#ffd166;
  --r1:#ff4d6d; --r2:#ff9f43; --r3:#ffd93d; --r4:#4ade80; --r5:#38bdf8; --r6:#7c5cff; --r7:#e879f9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
 font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif;}
body{
 background:
  radial-gradient(1200px 700px at 12% -8%, rgba(124,92,255,.22), transparent 60%),
  radial-gradient(900px 600px at 92% 4%, rgba(56,189,248,.18), transparent 58%),
  radial-gradient(800px 700px at 50% 108%, rgba(255,77,109,.14), transparent 62%),
  #070a12;
 min-height:100vh;
 padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom));
}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 0}
.title{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.title h1{font-size:20px;letter-spacing:4px;margin:0;
 background:linear-gradient(92deg,var(--r1),var(--r2),var(--r3),var(--r4),var(--r5),var(--r6),var(--r7));
 -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.title .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:2px 8px;letter-spacing:1px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;
 backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
 box-shadow:0 10px 30px rgba(0,0,0,.35)}
.panel h2{font-size:13px;letter-spacing:2px;color:var(--gold);margin:0 0 10px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.field{display:flex;flex-direction:column;gap:4px}
.field span{font-size:11px;color:var(--dim);letter-spacing:1px}
input,select{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;
 color:var(--txt);padding:9px 10px;font-size:14px;font-family:inherit;width:100%;outline:none}
input[type=checkbox]{width:auto}
select option{background:#121728;color:#eef2ff}
.row{display:flex;gap:9px;margin-top:10px;align-items:center;flex-wrap:wrap}
.btn{flex:1;min-width:120px;border:none;border-radius:12px;padding:12px;font-size:15px;font-family:inherit;
 letter-spacing:3px;color:#0a0d18;font-weight:700;
 background:linear-gradient(96deg,var(--r1),var(--r2),var(--r3),var(--r4),var(--r5),var(--r6));
 box-shadow:0 6px 18px rgba(124,92,255,.35)}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--txt);border:1px solid var(--line);box-shadow:none;letter-spacing:2px}
.btn:active{transform:scale(.985)}

/* 罗盘 */
.compass{position:relative;width:100%;max-width:520px;margin:0 auto 4px}
svg.disc{width:100%;display:block}
.legend{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:2px}
.legend i{font-size:10px;color:var(--dim);font-style:normal;border:1px solid var(--line);
 border-radius:8px;padding:2px 6px}

/* 四课 */
.sike{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ke{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center}
.ke .lbl{font-size:10px;color:var(--dim);letter-spacing:1px}
.ke .up{font-size:26px;font-weight:700;line-height:1.2}
.ke .down{font-size:20px;color:#cfd8f2;line-height:1.2;border-top:1px dashed var(--line);margin-top:4px;padding-top:4px}
.ke .jj{font-size:10px;color:var(--gold);margin-top:3px;letter-spacing:1px}
.ke .lq{font-size:10px;color:var(--dim)}

/* 三传 */
.chuan{display:flex;gap:8px}
.cz{flex:1;border-radius:14px;padding:9px 6px;text-align:center;border:1px solid var(--line);
 background:rgba(255,255,255,.05)}
.cz .n{font-size:10px;color:var(--dim)}
.cz .z{font-size:28px;font-weight:700;line-height:1.15}
.cz .j{font-size:11px;color:var(--gold);letter-spacing:1px}
.cz .q{font-size:11px;color:#bcc8e8}
.cz .f{font-size:10px;color:#ff8fa3;margin-top:2px}
.cz:first-child{background:linear-gradient(180deg,rgba(255,77,109,.22),rgba(255,255,255,.04))}
.cz:nth-child(2){background:linear-gradient(180deg,rgba(255,217,61,.18),rgba(255,255,255,.04))}
.cz:nth-child(3){background:linear-gradient(180deg,rgba(56,189,248,.18),rgba(255,255,255,.04))}

/* 解析 */
.read .sec{margin-bottom:16px}
.read .sec h3{font-size:13px;letter-spacing:2px;margin:0 0 6px;color:#a9c4ff;
 border-left:3px solid var(--r5);padding-left:8px}
.read p{font-size:14.5px;line-height:1.95;margin:0 0 9px;color:#e7ecfb;text-align:justify}
.read p b{color:var(--gold);font-weight:600}
.read .hint{font-size:12px;color:var(--dim);line-height:1.8}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.kv div{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.kv .k{font-size:10px;color:var(--dim);letter-spacing:1px}
.kv .v{font-size:14px;margin-top:2px}
.foot{text-align:center;color:#5f6a86;font-size:11px;line-height:1.9;padding:6px 0 18px}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(20,26,44,.95);
 border:1px solid var(--line);color:var(--txt);padding:10px 18px;border-radius:12px;font-size:13px;
 opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">
    <h1>大六壬神课</h1>
    <span class="tag">汉基 · 电子罗盘</span>
  </div>

  <div class="panel">
    <h2>起课</h2>
    <div class="grid">
      <div class="field"><span>日期</span><input id="fDate" type="date"></div>
      <div class="field"><span>时辰（本地）</span><input id="fTime" type="time"></div>
      <div class="field"><span>占类</span>
        <select id="fLei">
          <option value="general">综合占断</option>
          <option value="cai">求财 · 生意</option>
          <option value="hun">婚姻 · 感情</option>
          <option value="guan">官讼 · 是非</option>
          <option value="bing">疾病 · 身体</option>
          <option value="xing">出行 · 远行</option>
          <option value="shi">失物 · 寻人</option>
          <option value="kao">考试 · 文书</option>
          <option value="zhai">家宅 · 安居</option>
          <option value="mou">谋事 · 求官</option>
        </select>
      </div>
      <div class="field"><span>经度（真太阳时用）</span><input id="fLon" type="number" step="0.1" value="125.3"></div>
    </div>
    <div class="row">
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)">
        <input id="fTst" type="checkbox" checked> 真太阳时校正
      </label>
      <span style="font-size:11px;color:#5f6a86">夜子时自动进日</span>
    </div>
    <div class="row">
      <button class="btn" id="bGo">起　课</button>
      <button class="btn ghost" id="bNow">此刻</button>
      <button class="btn ghost" id="bCopy">复制断语</button>
    </div>
  </div>

  <div class="panel">
    <h2>天地盘 · 神将罗盘</h2>
    <div class="compass"><svg class="disc" id="disc" viewBox="0 0 420 420"></svg></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="panel">
    <h2>四课</h2>
    <div class="sike" id="sike"></div>
  </div>

  <div class="panel">
    <h2>三传</h2>
    <div class="chuan" id="chuan"></div>
    <div class="hint" id="chuanHint" style="font-size:12px;color:var(--dim);margin-top:8px"></div>
  </div>

  <div class="panel read" id="read"></div>

  <div class="foot">
    汉基科技 · 大六壬神课（离线单机版）<br>
    传统术数属古代文化模型，仅供研究与文化体验，不可代替医学、法律、财务等现实判断。
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/*ENGINE-START*/
(function(){
const ZHI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const GAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const ZHI_WX=['水','土','木','木','土','火','火','土','金','金','土','水'];
const GAN_WX=['木','木','火','火','土','土','金','金','水','水'];
const JI_GONG={'甲':2,'乙':4,'丙':5,'丁':7,'戊':5,'己':7,'庚':8,'辛':10,'壬':11,'癸':1};
const YUEJIANG=['神后','大吉','功曹','太冲','天罡','太乙','胜光','小吉','传送','从魁','河魁','登明'];
const TIANJIANG=['贵人','螣蛇','朱雀','六合','勾陈','青龙','天空','白虎','太常','玄武','太阴','天后'];
const WX_KE={'木':'土','土':'水','水':'火','火':'金','金':'木'};
const SHENG={'木':'火','火':'土','土':'金','金':'水','水':'木'};
const LIUHE={0:1,1:0,2:11,11:2,3:10,10:3,4:9,9:4,5:8,8:5,6:7,7:6};
const RILU={0:2,1:3,2:5,3:6,4:5,5:6,6:8,7:9,8:11,9:0};
const ANCHOR_MS=Date.UTC(1949,9,1);

function ke(a,b){ // a 五行 克 b 五行?
  return WX_KE[a]===b;
}
function p2(n){return (n%12+12)%12;}
function dayOfYear(y,m,d){
  const t=Date.UTC(y,m-1,d);
  return Math.floor((t-Date.UTC(y,0,1))/86400000)+1;
}
function sunLongitude(ms){
  const jd=ms/86400000+2440587.5;
  const T=(jd-2451545.0)/36525;
  const rad=Math.PI/180;
  const L0=280.46646+36000.76983*T+0.0003032*T*T;
  const M=357.52911+35999.05029*T-0.0001537*T*T;
  const C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(rad*M)
         +(0.019993-0.000101*T)*Math.sin(rad*2*M)
         +0.000289*Math.sin(rad*3*M);
  const Om=125.04452-1934.136261*T;
  let L=L0+C-0.00569-0.00478*Math.sin(rad*Om);
  return ((L%360)+360)%360;
}
function yuejiangOf(lam){
  const k=Math.floor(((((lam-330)%360)+360)%360)/30);
  return p2(11-k);
}
function dayGanzhi(y,m,d){
  const n=Math.round((Date.UTC(y,m-1,d)-ANCHOR_MS)/86400000);
  const idx=p2(0)+((n%60)+60)%60;
  return {gan:idx%10,zhi:idx%12,idx:idx%60};
}
function xunKong(gan,zhi){
  const s=p2(zhi-gan);
  return [p2(s-1),p2(s-2)];
}
function yimaOf(zhi){
  if(zhi===8||zhi===0||zhi===4) return 2;
  if(zhi===2||zhi===6||zhi===10) return 8;
  if(zhi===5||zhi===9||zhi===1) return 11;
  return 5;
}
function liuqin(gan,z){
  const W=GAN_WX[gan],S=ZHI_WX[z];
  if(S===W) return '兄弟';
  if(SHENG[W]===S) return '子孙';
  if(SHENG[S]===W) return '父母';
  if(WX_KE[S]===W) return '官鬼';
  return '妻财';
}
function guirenZhi(gan,isDay){
  const g=gan;
  if(g===0||g===4||g===6) return isDay?1:7;
  if(g===1||g===5) return isDay?0:8;
  if(g===2||g===3) return isDay?11:9;
  if(g===7) return isDay?6:2;
  return isDay?5:3; // 壬癸
}
function tianjiangMap(tianpan,gan,hourZhi){
  const isDay=(hourZhi>=3&&hourZhi<=8);
  const gz=guirenZhi(gan,isDay);
  const p=tianpan.indexOf(gz);
  const dir=(p===11||p<=4)?1:-1;
  const map={};
  for(let k=0;k<12;k++){
    map[p2(gz+dir*k)]=TIANJIANG[k];
  }
  return {map:map,dir:dir,guirenPos:p,isDay:isDay,guirenZhi:gz};
}
/* 刑：子刑卯、丑刑戌、寅刑巳、卯刑子、巳刑申、未刑丑、申刑寅、戌刑未；辰午酉亥自刑 */
function xingOf(z){
  const T=[3,10,5,0,4,8,6,1,2,9,7,11];
  return T[z];
}
function isSelfXing(z){return [4,6,9,11].indexOf(z)>=0;}

function shehai(tianpan,upper){
  const p=tianpan.indexOf(upper);
  let d1=0,d2=0;
  for(let s=1;s<12;s++){
    const q=p2(p+s);
    const low=ZHI_WX[q], up=ZHI_WX[tianpan[q]];
    if(ke(low,up)) d1++;
    if(ke(low,up)||ke(up,low)) d2++;
  }
  return {d1:d1,d2:d2,p:p};
}

/* 取三传：九宗门 */
function pickChuan(ctx){
  const {courses,tianpan,gan,zhi,hourZhi,yuejiang}=ctx;
  const bi=(a,b)=>p2(a-b)===6;

  // 伏吟
  if(yuejiang===hourZhi){
    return futunYin(ctx);
  }
  if(bi(yuejiang,hourZhi)){
    return fanyinKe(ctx);
  }

  const zeiLi=[],keLi=[];
  courses.forEach((c,i)=>{
    const up=ZHI_WX[c.upper], low=ZHI_WX[c.lower];
    if(ke(low,up)) zeiLi.push(i);
    else if(ke(up,low)) keLi.push(i);
  });

  let cand=[],isZei=false;
  if(zeiLi.length){cand=zeiLi;isZei=true;}
  else if(keLi.length){cand=keLi;isZei=false;}

  if(cand.length){
    if(cand.length===1){
      const c1=courses[cand[0]].upper;
      return chain(c1,{
        type:isZei?'重审':'元首',
        basis:isZei?'四课中只一下贼上，取该上神为用，曰重审课——事由下起，须详审而后动。'
                  :'四课中只一上克下，取该上神为用，曰元首课——事从上起，尊长主动，理直气顺。'
      },ctx);
    }
    // 比用
    const yangGan=(gan%2===0);
    let same=cand.filter(i=>((courses[i].upper%2===0)===yangGan));
    let useList = same.length?same:cand;
    if(useList.length===1&&same.length===1){
      return chain(courses[useList[0]].upper,{
        type:'比用（知一）',
        basis:'贼克不止一处，取与日干阴阳相比者发用，曰比用课（知一）——事有两端，择其同类者先行。'
      },ctx);
    }
    // 涉害
    let best=[],max1=-1,max2=-1;
    useList.forEach(i=>{
      const u=courses[i].upper;
      const r=shehai(tianpan,u);
      if(r.d1>max1||(r.d1===max1&&r.d2>max2)){
        max1=r.d1;max2=r.d2;best=[u];
      }else if(r.d1===max1&&r.d2===max2){best.push(u);}
    });
    let type='涉害',basis='';
    if(best.length>1){
      const ganShang=courses[0].upper,zhiShang=courses[2].upper;
      const pickYang=(gan%2===0);
      const first=pickYang?ganShang:zhiShang;
      const c1=best.indexOf(first)>=0?first:best[0];
      type=pickYang?'涉害·见机':'涉害·察微';
      basis='涉害深浅相等，复以'+(pickYang?'阳日取干上神（见机）':'阴日取支上神（察微）')+'为用，曰涉害课——事经曲折，久而后定。';
      return chain(c1,{type:type,basis:basis},ctx);
    }else{
      const r=shehai(tianpan,best[0]);
      basis='贼克众多而比用难分，较其涉害深浅（历宫受克数'+r.d1+'），取最深者发用，曰涉害课——事多纠缠，非一蹴可成。';
      return chain(best[0],{type:type,basis:basis},ctx);
    }
  }

  // 无克：遥克
  const ganWX=GAN_WX[gan];
  const yaoKe=courses.map((c,i)=>i).filter(i=>ke(ZHI_WX[courses[i].upper],ganWX));
  if(yaoKe.length){
    let idx=yaoKe;
    if(idx.length>1){
      const yangGan=(gan%2===0);
      const same=idx.filter(i=>((courses[i].upper%2===0)===yangGan));
      if(same.length) idx=same;
      if(idx.length>1){
        idx=[idx.slice().sort((a,b)=>shehai(tianpan,courses[b].upper).d1-shehai(tianpan,courses[a].upper).d1)[0]];
      }
    }
    return chain(courses[idx[0]].upper,{
      type:'蒿矢',basis:'四课无上下之克，唯上神遥克日干，取以为用，曰蒿矢课——事从外来，远而不亲，其力尚轻。'
    },ctx);
  }
  const woKe=courses.map((c,i)=>i).filter(i=>ke(ganWX,ZHI_WX[courses[i].upper]));
  if(woKe.length){
    let idx=woKe;
    if(idx.length>1){
      const yangGan=(gan%2===0);
      const same=idx.filter(i=>((courses[i].upper%2===0)===yangGan));
      if(same.length) idx=same;
    }
    return chain(courses[idx[0]].upper,{
      type:'弹射',basis:'四课无克，亦无上神克干，唯日干遥克上神，取以为用，曰弹射课——我求于外，力弱而志远，须借势乃成。'
    },ctx);
  }

  // 八专 / 别责 / 昴星
  const jg=JI_GONG[GAN[gan]];
  if(jg===zhi){
    const yangGan=(gan%2===0);
    const c1=yangGan?p2(courses[0].upper+2):p2(courses[2].upper-2);
    const c2=courses[0].upper,c3=courses[0].upper;
    return {type:'八专',basis:'日干寄宫与日支同位，四课只得两课，无克可取了，阳日从干上神顺数三位、阴日从支上神逆数三位为用，曰八专课——干支同处，混杂不明的，事在暧昧之间。',
            chuan:[c1,c2,c3]};
  }
  if(courses[0].upper===zhi){
    const yangGan=(gan%2===0);
    let c1;
    if(yangGan){
      const heGan=(gan+5)%10;
      c1=tianpan[JI_GONG[GAN[heGan]]];
    }else{
      c1=tianpan[p2(zhi+4)];
    }
    return {type:'别责',basis:'四课只得三课，又无克可取了，阳日取干合上神、阴日取支前三合上神为用，曰别责课——势不专一，事须借他人之力，别有所责。',
            chuan:[c1,courses[0].upper,courses[0].upper]};
  }
  // 昴星
  {
    const yangGan=(gan%2===0);
    let c1;
    if(yangGan) c1=tianpan[9];
    else c1=tianpan.indexOf(9);
    const ganShang=courses[0].upper,zhiShang=courses[2].upper;
    return {type:yangGan?'昴星（虎视）':'昴星（冬蛇掩目）',
      basis:'四课无克，又无遥克，仰俯取酉（昴宿）为用，曰昴星课——'+(yangGan?'阳日仰视，事在明处而难发，须待时而动。':'阴日俯视，事在暗处，隐伏不明，宜静守。'),
      chuan:yangGan?[c1,zhiShang,ganShang]:[c1,ganShang,zhiShang]};
  }
}

function chain(c1,meta,ctx){
  const t=ctx.tianpan;
  return {type:meta.type,basis:meta.basis,chuan:[c1,t[c1],t[t[c1]]]};
}

function futunYin(ctx){
  const {courses,gan,tianpan}=ctx;
  const zeiLi=[],keLi=[];
  courses.forEach((c,i)=>{
    const up=ZHI_WX[c.upper],low=ZHI_WX[c.lower];
    if(ke(low,up)) zeiLi.push(i); else if(ke(up,low)) keLi.push(i);
  });

  }
  const c2=isSelfXing(c1)?p2(c1+6):xingOf(c1);
  const c3=isSelfXing(c2)?p2(c2+6):xingOf(c2);
  return {type:(gan%2===0)?'伏吟（自任）':'伏吟（自信）',

function fanyinKe(ctx){

function buildChart(opt){
  const {year,month,day,hour,minute}=opt;
  const lon=(opt.longitude===undefined?125.3:opt.longitude);
  const useTst=(opt.useTrueSolar!==false);
  let corr=0;
  if(useTst){
    const doy=dayOfYear(year,month,day);
    const B=2*Math.PI*(doy-81)/364;
    const eot=9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B);
    corr=(lon-120)*4+eot;
  }
  const t0=new Date(year,month-1,day,hour,minute,0);
  const t=new Date(t0.getTime()+Math.round(corr)*60000);
  const th=t.getHours(),tmin=t.getMinutes();
  const hourZhi=Math.floor(((th+1)%24)/2)%12;

  let dy=t.getFullYear(),dm=t.getMonth()+1,dd=t.getDate();
  if(th>=23){const nx=new Date(dy,dm-1,dd+1);dy=nx.getFullYear();dm=nx.getMonth()+1;dd=nx.getDate();}
  const dgz=dayGanzhi(dy,dm,dd);

  const lambda=sunLongitude(t.getTime());
  const yuejiang=yuejiangOf(lambda);

  const tianpan=[];
  for(let b=0;b<12;b++) tianpan[b]=p2(yuejiang+p2(b-hourZhi));

  const gan=dgz.gan,zhi=dgz.zhi;
  const jg=JI_GONG[GAN[gan]];
  const ganShang=tianpan[jg], zhiShang=tianpan[zhi];
  const courses=[
    {lower:jg,upper:ganShang},
    {lower:ganShang,upper:tianpan[ganShang]},
    {lower:zhi,upper:zhiShang},
    {lower:zhiShang,upper:tianpan[zhiShang]}
  ];

  const ctx={courses,tianpan,gan,zhi,hourZhi,yuejiang,lambda,jg,ganShang,zhiShang};
  const sc=pickChuan(ctx);
  const tj=tianjiangMap(tianpan,gan,hourZhi);
  const kong=xunKong(gan,zhi);
  const ma=yimaOf(zhi);
  const lu=RILU[gan];

  const chuan=sc.chuan.map((z,i)=>({
    zhi:z,pos:i===0?'初传':i===1?'中传':'末传',
    jiang:tj.map[z],liuqin:liuqin(gan,z),
    kong:kong.indexOf(z)>=0, ma:(z===ma), lu:(z===lu),
    selfXing:isSelfXing(z)
  }));

  return {
    input:opt, realTime:t, corr:corr, hourZhi, dayGanzhi:dgz, gan, zhi, jg,
    yuejiang, lambda, tianpan, courses, chuan, type:sc.type, basis:sc.basis,
    jiang:tj.map, jiangDir:tj.dir, isDay:tj.isDay, guirenZhi:tj.guirenZhi, guirenPos:tj.guirenPos,
    kong, yima:ma, rilu:lu,
    ganShang, zhiShang
  };
}

    const p=[lm.text+'。'];
    if(hits.length) p.push('本课中类神现于：'+hits.join('；')+'。类神现而有气（不空、不受克），则所问之事有实可凭；现而落空或受克，则形似而实虚。');
    else p.push('本课三传四课未见明显类神，主所问之事目前无着力之处：宜暂缓、宜另寻路径，或待类神出现之月日再议。');
    const maHit=c.chuan.some(t=>t.ma);
    if(lei==='xing'&&maHit) p.push('驿马入传，动象已成，行止之机在近。');
    if(lei==='cai'&&c.chuan.some(t=>t.liuqin==='妻财'&&!t.kong)) p.push('财爻不空，财路可通，然须察其所乘之将：乘青龙则正财，乘玄武则防暗耗。');
    if(lei==='guan'&&c.chuan.some(t=>t.liuqin==='官鬼'&&t.kong)) p.push('官鬼落空，是非多虚，然不可因此轻慢，防其后方再起。');
    secs.push({h:'专占：'+lm.name,p:p});
  }

  secs.push({h:'提示',p:['以上皆依古法课体、神将、六亲、空亡、刑冲之例推出，属传统象数模型，不同流派（重理法／重象法／重课体）判语略有出入。<br>此类术数未经科学验证，请作文化研读与思路参照，切勿以此替代医疗、法律、投资等现实决策。'],
    hint:true});
  return secs;
}

globalThis.LR={buildChart,generateReading,ZHI,GAN,ZHI_WX,GAN_WX,YUEJIANG,TIANJIANG,dayGanzhi,xunKong,liuqin,jieqiName};
})();
/*ENGINE-END*/
</script>

<script>
(function(){
const {buildChart,generateReading,ZHI,GAN,ZHI_WX,YUEJIANG,TIANJIANG}=LR;
const $=id=>document.getElementById(id);
const WXC={'木':'#4ade80','火':'#ff6b6b','土':'#ffd166','金':'#dfe6f0','水':'#5ab0ff'};
const RAINBOW=['#ff4d6d','#ff9f43','#ffd93d','#4ade80','#38bdf8','#7c5cff','#e879f9',
               '#ff4d6d','#ff9f43','#ffd93d','#4ade80','#38bdf8','#7c5cff'];
let CUR=null, TEXT='';

function pad(n){return ('0'+n).slice(-2)}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1800)}

function todayStr(){
  const d=new Date();
  $('fDate').value=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  $('fTime').value=pad(d.getHours())+':'+pad(d.getMinutes());
}
todayStr();

function pol(cx,cy,r,deg){const a=deg*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]}
function sectorPath(cx,cy,r1,r2,a1,a2){
  const [x1,y1]=pol(cx,cy,r2,a1),[x2,y2]=pol(cx,cy,r2,a2),
        [x3,y3]=pol(cx,cy,r1,a2),[x4,y4]=pol(cx,cy,r1,a1);
  return 'M'+x1.toFixed(2)+' '+y1.toFixed(2)+
    ' A'+r2+' '+r2+' 0 0 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+
    ' L'+x3.toFixed(2)+' '+y3.toFixed(2)+
    ' A'+r1+' '+r1+' 0 0 0 '+x4.toFixed(2)+' '+y4.toFixed(2)+' Z';
}

function drawDisc(c){
  const cx=210,cy=210;
  const svg=$('disc');
  let s='<defs>';
  s+='<radialGradient id="core" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#2a3560"/><stop offset="1" stop-color="#0d1120"/></radialGradient>';
  s+='<linearGradient id="ring1" x1="0" y1="0" x2="1" y2="1">';
  ['#ff4d6d','#ff9f43','#ffd93d','#4ade80','#38bdf8','#7c5cff','#e879f9'].forEach((col,i)=>{
    s+='<stop offset="'+(i/6*100).toFixed(1)+'%" stop-color="'+col+'"/>';});
  s+='</linearGradient>';
  s+='<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>';
  s+='</defs>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="204" fill="none" stroke="url(#ring1)" stroke-width="2.4" opacity=".85" filter="url(#glow)"/>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="101" fill="url(#core)" stroke="rgba(255,255,255,.10)"/>';

  // 地盘（外环）
  for(let i=0;i<12;i++){
    const a1=-90+i*30-15, a2=a1+30, am=-90+i*30;
    const col=RAINBOW[i%7];
    s+='<path d="'+sectorPath(cx,cy,158,198,a1,a2)+'" fill="'+col+'" opacity=".10"/>';
    s+='<path d="'+sectorPath(cx,cy,158,198,a1,a2)+'" fill="none" stroke="'+col+'" stroke-opacity=".42" stroke-width="1"/>';
    const [tx,ty]=pol(cx,cy,178,am);
    s+='<text x="'+tx.toFixed(1)+'" y="'+(ty+2).toFixed(1)+'" text-anchor="middle" dominant-baseline="middle" font-size="19" fill="'+WXC[ZHI_WX[i]]+'" font-weight="700" opacity=".92">'+ZHI[i]+'</text>';
    // 五行小字
    const [sx,sy]=pol(cx,cy,163,am+11);
    s+='<text x="'+sx.toFixed(1)+'" y="'+sy.toFixed(1)+'" text-anchor="middle" font-size="8" fill="#8e9ab5">'+ZHI_WX[i]+'</text>';
  }
  // 天盘（中环）
  for(let i=0;i<12;i++){
    const am=-90+i*30, a1=am-15,a2=am+15;
    const z=c.tianpan[i];
    s+='<path d="'+sectorPath(cx,cy,120,156,a1,a2)+'" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.13)" stroke-width=".8"/>';
    const [tx,ty]=pol(cx,cy,145,am);
    s+='<text x="'+tx.toFixed(1)+'" y="'+(ty+2).toFixed(1)+'" text-anchor="middle" dominant-baseline="middle" font-size="16.5" fill="'+WXC[ZHI_WX[z]]+'" font-weight="600">'+ZHI[z]+'</text>';
    const [jx,jy]=pol(cx,cy,131,am);
    s+='<text x="'+jx.toFixed(1)+'" y="'+jy.toFixed(1)+'" text-anchor="middle" font-size="7" fill="#ffd166" opacity=".85">'+c.jiang[z]+'</text>';
  }
  // 三传标记（同宫重合时自动错开）
  const groups={};
  c.chuan.forEach((t,i)=>{
    const p=c.tianpan.indexOf(t.zhi);
    (groups[p]=groups[p]||[]).push({t:t,i:i});
  });
  Object.keys(groups).forEach(k=>{
    const arr=groups[k], n=arr.length;
    arr.forEach((it,j)=>{
      const ang=-90+Number(k)*30+(n>1?(j-(n-1)/2)*14:0);
      const [mx,my]=pol(cx,cy,110,ang);
      const ringCol=it.i===0?'#ff4d6d':it.i===1?'#ffd93d':'#38bdf8';
      s+='<circle cx="'+mx.toFixed(1)+'" cy="'+my.toFixed(1)+'" r="8.6" fill="rgba(8,12,24,.92)" stroke="'+ringCol+'" stroke-width="1.5"/>';
      s+='<text x="'+mx.toFixed(1)+'" y="'+(my+1).toFixed(1)+'" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="'+ringCol+'">'+(it.i+1)+'</text>';
    });
  });
  // 中心
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="56" fill="none" stroke="url(#ring1)" stroke-width="1.6" opacity=".7"/>';
  s+='<text x="'+cx+'" y="'+(cy-30)+'" text-anchor="middle" font-size="11" fill="#9aa6c4">'+ZHI[c.yuejiang]+'将加'+ZHI[c.hourZhi]+'时</text>';
  s+='<text x="'+cx+'" y="'+(cy-8)+'" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">'+GAN[c.gan]+ZHI[c.zhi]+'</text>';
  s+='<text x="'+cx+'" y="'+(cy+12)+'" text-anchor="middle" font-size="10" fill="#ffd166">'+c.type+'</text>';
  s+='<text x="'+cx+'" y="'+(cy+30)+'" text-anchor="middle" font-size="10" fill="#ff8fa3">空 '+c.kong.map(z=>ZHI[z]).join('')+'</text>';
  s+='<text x="'+cx+'" y="'+(cy+44)+'" text-anchor="middle" font-size="9" fill="#6f7a96">贵人'+ZHI[c.guirenZhi]+(c.jiangDir>0?'顺':'逆')+'</text>';
  svg.innerHTML=s;

  $('legend').innerHTML=['外环·地盘','中环·天盘','环内小字·天将','①②③·初/中/末传'].map(t=>'<i>'+t+'</i>').join('');
}

function drawSike(c){
  const html=c.courses.map((k,i)=>{
    const j=c.jiang[k.upper];
    return '<div class="ke"><div class="lbl">第'+['一','二','三','四'][i]+'课</div>'+
      '<div class="up" style="color:'+WXC[ZHI_WX[k.upper]]+'">'+ZHI[k.upper]+'</div>'+
      '<div class="down" style="color:'+WXC[ZHI_WX[k.lower]]+'">'+ZHI[k.lower]+'</div>'+
      '<div class="jj">'+j+'</div><div class="lq">'+LR.liuqin(c.gan,k.upper)+'</div></div>';
  }).join('');
  $('sike').innerHTML=html;
}
function drawChuan(c){
  const html=c.chuan.map(t=>{
    const flags=[];if(t.kong)flags.push('空');if(t.ma)flags.push('马');if(t.lu)flags.push('禄');
    return '<div class="cz"><div class="n">'+t.pos+'</div>'+
      '<div class="z" style="color:'+WXC[ZHI_WX[t.zhi]]+'">'+ZHI[t.zhi]+'</div>'+
      '<div class="j">'+t.jiang+'</div><div class="q">'+t.liuqin+'</div>'+
      '<div class="f">'+(flags.length?flags.join('·'):'&nbsp;')+'</div></div>';
  }).join('');
  $('chuan').innerHTML=html;
  $('chuanHint').textContent='初传=发端｜中传=中变｜末传=归宿；空=旬空，马=驿马，禄=日禄。';
}
function drawRead(c,lei){
  const secs=generateReading(c,lei);
  let html='<h2>断语详析</h2>';
  secs.forEach(s=>{
    html+='<div class="sec"><h3>'+s.h+'</h3>';
    if(s.kv){
      html+='<div class="kv">'+s.kv.map(k=>'<div><div class="k">'+k[0]+'</div><div class="v">'+k[1]+'</div></div>').join('')+'</div>';
    }
    (s.p||[]).forEach(p=>{html+='<p'+(s.hint?' class="hint"':'')+'>'+p+'</p>';});
    html+='</div>';
  });
  $('read').innerHTML=html;
}

function run(){
  const dv=$('fDate').value, tv=$('fTime').value||'00:00';
  if(!dv){toast('请先选日期');return}
  const [y,m,d]=dv.split('-').map(Number);
  const [hh,mm]=tv.split(':').map(Number);
  const lon=parseFloat($('fLon').value)||120;
  const lei=$('fLei').value;
  const c=buildChart({year:y,month:m,day:d,hour:hh,minute:mm,longitude:lon,useTrueSolar:$('fTst').checked});
  CUR=c;
  drawDisc(c);drawSike(c);drawChuan(c);drawRead(c,lei);
  TEXT=buildCopy(c,lei);
  try{localStorage.setItem('lr_lon',String(lon))}catch(e){}
  window.scrollTo({top:0,behavior:'smooth'});
}
function buildCopy(c,lei){
  const secs=generateReading(c,lei);
  let t='【大六壬神课 · 汉基】\n';
  t+='占时：'+ZHI[c.hourZhi]+'时　月将：'+ZHI[c.yuejiang]+YUEJIANG[c.yuejiang]+'　日辰：'+GAN[c.gan]+ZHI[c.zhi]+'\n';
  t+='课体：'+c.type+'　旬空：'+c.kong.map(z=>ZHI[z]).join('')+'\n';
  t+='四课：'+c.courses.map(k=>ZHI[k.upper]+'/'+ZHI[k.lower]).join('　')+'\n';
  t+='三传：'+c.chuan.map(x=>x.pos+ZHI[x.zhi]+x.jiang+x.liuqin).join('　')+'\n\n';
  secs.forEach(s=>{
    if(s.kv) s.kv.forEach(k=>{t+=k[0]+'：'+k[1]+'\n'});
    (s.p||[]).forEach(p=>{t+=s.h==='提示'?p.replace(/<br>/g,'\n').replace(/<[^>]+>/g,''):'· '+p.replace(/<[^>]+>/g,'')+'\n';});
    t+='\n';
  });
  return t;
}
$('bGo').onclick=run;
$('bNow').onclick=()=>{todayStr();run()};
$('bCopy').onclick=async()=>{
  if(!TEXT){toast('请先起课');return}
  try{await navigator.clipboard.writeText(TEXT);toast('断语已复制')}
  catch(e){
    const ta=document.createElement('textarea');ta.value=TEXT;document.body.appendChild(ta);ta.select();
    document.execCommand('copy');ta.remove();toast('断语已复制');
  }
};
try{
  const saved=localStorage.getItem('lr_lon');
  if(saved) $('fLon').value=saved;
}catch(e){}
run();
})();
</script>
</body>
</html>
