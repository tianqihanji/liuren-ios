name: Probe
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "actions alive"; uname -a
  probe-macos:
    runs-on: macos-13
    steps:
      - run: echo "macos alive"; sw_vers; xcodebuild -version
